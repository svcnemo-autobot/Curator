version: 2
registries:
  vllm-cu129:
    type: python-index
    url: https://wheels.vllm.ai/0.22.0/cu129
updates:
  - package-ecosystem: "uv"
    directory: "/"
    registries:
      - vllm-cu129
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "Etc/UTC"
    # Keep dependency declarations and coordinated CUDA/PyTorch pins unchanged.
    versioning-strategy: "lockfile-only"
    cooldown:
      default-days: 7
      semver-major-days: 30
      semver-minor-days: 14
      semver-patch-days: 7
    groups:
      weekly-dependencies:
        applies-to: version-updates
        patterns:
          - "*"
    allow:
      - dependency-type: "all"
